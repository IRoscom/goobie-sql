name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the v prefix (e.g. 4.16.7)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-sql-lib:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build goobie-sql.lua
        working-directory: sql
        run: python3 build.py ${{ inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: goobie-sql-lua
          path: sql/goobie-sql.lua

  build-mysql:
    strategy:
      matrix:
        include:
          - runs_on: ubuntu-22.04
            target: i686-unknown-linux-gnu
            src: libgmsv_goobie_mysql.so
            suffix: _linux.dll
          - runs_on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            src: libgmsv_goobie_mysql.so
            suffix: _linux64.dll
          - runs_on: windows-2022
            target: i686-pc-windows-msvc
            src: gmsv_goobie_mysql.dll
            suffix: _win32.dll
          - runs_on: windows-2022
            target: x86_64-pc-windows-msvc
            src: gmsv_goobie_mysql.dll
            suffix: _win64.dll
    runs-on: ${{ matrix.runs_on }}
    defaults:
      run:
        shell: bash
        working-directory: mysql
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        env:
          VERSION: ${{ inputs.version }}
        run: echo "version_major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Install build dependencies
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo apt update
          sudo apt install -y gcc-multilib

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mysql
          shared-key: ${{ matrix.target }}

      - name: Bump Cargo version
        env:
          VERSION: ${{ inputs.version }}
        run: sed -i "0,/^version = .*/s//version = \"${VERSION}\"/" Cargo.toml

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Collect binary
        env:
          MAJOR: ${{ steps.get_version.outputs.version_major }}
        run: |
          mkdir -p dist
          mv "target/${{ matrix.target }}/release/${{ matrix.src }}" "dist/gmsv_goobie_mysql_${MAJOR}${{ matrix.suffix }}"

      - uses: actions/upload-artifact@v4
        with:
          name: mysql-${{ matrix.target }}
          path: mysql/dist/*

  release:
    needs: [build-sql-lib, build-mysql]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create tag and release
        run: |
          gh release create "v${{ inputs.version }}" artifacts/* \
            --target "${{ github.sha }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes
